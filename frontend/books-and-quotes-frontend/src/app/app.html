<nav class="navbar navbar-expand-lg navbar-dark app-navbar px-3 px-lg-4">
  <a class="navbar-brand app-brand d-flex align-items-center gap-2" routerLink="/">
    <i class="fa-solid fa-book-open-reader"></i>
    <span>Books and Quotes</span>
  </a>

  <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="mainNav">
    <div class="navbar-nav ms-auto align-items-lg-center gap-2 mt-3 mt-lg-0">
      <a class="nav-link app-nav-link d-flex align-items-center" routerLink="/login" routerLinkActive="active" (click)="closeNavbar()">
        <i class="fa-solid fa-right-to-bracket me-2"></i>
        <span>Login</span>
      </a>

      <a class="nav-link app-nav-link d-flex align-items-center" routerLink="/register" routerLinkActive="active" (click)="closeNavbar()">
        <i class="fa-solid fa-user-plus me-2"></i>
        <span>Register</span>
      </a>

      <a class="nav-link app-nav-link d-flex align-items-center" routerLink="/books" routerLinkActive="active" (click)="closeNavbar()">
        <i class="fa-solid fa-book me-2"></i>
        <span>Books</span>
      </a>

      <a class="nav-link app-nav-link d-flex align-items-center" routerLink="/quotes" routerLinkActive="active" (click)="closeNavbar()">
        <i class="fa-solid fa-quote-left me-2"></i>
        <span>Quotes</span>
      </a>

      <button
        class="btn btn-sm btn-outline-light app-theme-toggle ms-lg-2 d-flex align-items-center justify-content-center gap-2"
        type="button"
        (click)="toggleTheme()"
      >
        <i class="fa-solid" [ngClass]="isDarkTheme() ? 'fa-sun' : 'fa-moon'"></i>
        <span>{{ isDarkTheme() ? 'Light' : 'Dark' }}</span>
      </button>

      <button
        *ngIf="authService.isLoggedIn()"
        class="btn btn-sm btn-light app-logout ms-lg-2 d-flex align-items-center justify-content-center gap-2"
        type="button"
        (click)="closeNavbar(); logout()"
      >
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>
</nav>

<main class="app-shell">
  <router-outlet></router-outlet>
</main>
