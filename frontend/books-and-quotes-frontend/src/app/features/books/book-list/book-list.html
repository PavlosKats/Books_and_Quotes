<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>
      <i class="fa-solid fa-book me-2"></i>
      My Books
    </h2>

    <button class="btn btn-primary">
      <i class="fa-solid fa-plus me-1"></i>
      Add Book
    </button>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="books.length === 0 && !errorMessage" class="card shadow-sm">
    <div class="card-body text-center py-5">
      <p class="mb-0 text-muted">No books yet. Add your first book.</p>
    </div>
  </div>

  <div *ngFor="let book of books" class="card shadow-sm mb-3">
    <div class="card-body">
      <h5 class="card-title">{{ book.title }}</h5>
      <p class="card-text mb-1"><strong>Author:</strong> {{ book.author }}</p>
      <p class="card-text mb-1"><strong>Year:</strong> {{ book.yearPublished }}</p>
      <p class="card-text mb-0"><strong>ISBN:</strong> {{ book.isbn }}</p>
    </div>
  </div>
</div>
