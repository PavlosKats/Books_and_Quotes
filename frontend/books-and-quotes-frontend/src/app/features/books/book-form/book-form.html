<div class="container py-4 py-lg-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-lg-5">
          <div class="d-flex align-items-center gap-3 mb-4">
            <div class="form-icon text-bg-primary text-white">
              <i class="fa-solid fa-book"></i>
            </div>
            <div>
              <h2 class="mb-1 fw-bold">{{ id === null ? 'Add Book' : 'Edit Book' }}</h2>
              <p class="text-muted mb-0">Keep your book details organized and up to date.</p>
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger border-0 shadow-sm">
            {{ errorMessage }}
          </div>

          <div *ngIf="validationMessage" class="alert alert-warning border-0 shadow-sm">
            {{ validationMessage }}
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="title" class="form-label fw-semibold">Title</label>
              <input
                type="text"
                id="title"
                class="form-control"
                name="title"
                [(ngModel)]="title"
                required
              />
              <div class="text-danger mt-1 small" *ngIf="submitted && !title">
                Title is required.
              </div>
            </div>

            <div class="mb-3">
              <label for="author" class="form-label fw-semibold">Author</label>
              <input
                type="text"
                id="author"
                class="form-control"
                name="author"
                [(ngModel)]="author"
                required
              />
              <div class="text-danger mt-1 small" *ngIf="submitted && !author">
                Author is required.
              </div>
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-6 mb-3">
                <label for="yearPublished" class="form-label fw-semibold">Year Published</label>
                <input
                  type="number"
                  id="yearPublished"
                  class="form-control"
                  name="yearPublished"
                  [(ngModel)]="yearPublished"
                  required
                />
                <div class="text-danger mt-1 small" *ngIf="submitted && !yearPublished">
                  Year Published is required.
                </div>
              </div>

              <div class="col-12 col-md-6 mb-3">
                <label for="isbn" class="form-label fw-semibold">ISBN</label>
                <input
                  type="text"
                  id="isbn"
                  class="form-control"
                  name="isbn"
                  [(ngModel)]="isbn"
                  required
                />
                <div class="text-danger mt-1 small" *ngIf="submitted && !isbn">
                  ISBN is required.
                </div>
              </div>
            </div>

            <div class="mb-4">
              <label for="coverImageUrl" class="form-label fw-semibold">Cover Image URL</label>
              <input
                type="text"
                id="coverImageUrl"
                class="form-control"
                name="coverImageUrl"
                [(ngModel)]="coverImageUrl"
              />
            </div>

            <div class="d-flex flex-column flex-sm-row gap-2">
              <button type="submit" class="btn btn-primary px-4">
                <i class="fa-solid fa-floppy-disk me-2"></i>
                Save Book
              </button>
              <a routerLink="/books" class="btn btn-outline-secondary px-4">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
