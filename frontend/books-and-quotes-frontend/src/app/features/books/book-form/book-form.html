<div class="container mt-5" style="max-width: 600px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h2 class="mb-4">
        <i class="fa-solid fa-pen-to-square me-2"></i>
        Add Book
      </h2>

      <form>
        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" id="title" class="form-control" />
        </div>

        <div class="mb-3">
          <label for="author" class="form-label">Author</label>
          <input type="text" id="author" class="form-control" />
        </div>

        <div class="mb-3">
          <label for="yearPublished" class="form-label">Year Published</label>
          <input type="number" id="yearPublished" class="form-control" />
        </div>

        <div class="mb-3">
          <label for="isbn" class="form-label">ISBN</label>
          <input type="text" id="isbn" class="form-control" />
        </div>

        <div class="mb-3">
          <label for="coverImageUrl" class="form-label">Cover Image URL</label>
          <input type="text" id="coverImageUrl" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary">
          Save Book
        </button>
      </form>
    </div>
  </div>
</div>
