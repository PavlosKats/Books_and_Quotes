<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>
      <i class="fa-solid fa-quote-left me-2"></i>
      My Quotes
    </h2>

    <button class="btn btn-primary">
      <i class="fa-solid fa-plus me-1"></i>
      Add Quote
    </button>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="quotes.length === 0 && !errorMessage" class="card shadow-sm">
    <div class="card-body text-center py-5">
      <p class="mb-0 text-muted">No quotes yet. Add your first quote.</p>
    </div>
  </div>

  <div *ngFor="let quote of quotes" class="card shadow-sm mb-3">
    <div class="card-body">
      <p class="card-text mb-2">{{ quote.content }}</p>
      <p class="card-text mb-0">
        <strong>Author:</strong> {{ quote.author || 'Unknown' }}
      </p>
    </div>
  </div>
</div>
